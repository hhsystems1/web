[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"

[[redirects]]
  from = "/demos/stressless/viz/photo/:file"
  to = "https://www.stresslessremodels.com/_next/image?url=%2Fcdn--media%2F:file&w=1080&q=80"
  status = 200
  force = true

[[redirects]]
  from = "/demos/stressless/viz/tex/:file"
  to = "https://cdn.shopify.com/s/files/1/0759/2978/0515/files/:file"
  status = 200
  force = true

[[redirects]]
  from = "/demos/stressless/*"
  to = "/demos/stressless/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://checkout.stripe.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://d2ol7oe51mr4n9.cloudfront.net; font-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https://www.clarity.ms https://*.clarity.ms https://js.stripe.com https://www.googletagmanager.com https://connect.facebook.net; connect-src 'self' https://*.clarity.ms https://c.bing.com https://api.stripe.com https://www.google-analytics.com https://www.facebook.com; frame-src https://js.stripe.com https://checkout.stripe.com https://www.youtube.com https://www.youtube-nocookie.com https://hhsdemo2.netlify.app; upgrade-insecure-requests; block-all-mixed-content"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"
